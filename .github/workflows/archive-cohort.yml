# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Archive cohort

# End of term, once, after the last grades have gone out. Revokes each student's direct
# grant on the submission repos and gradebooks named after them, ARCHIVES those repos,
# archives `welcome` so a finished term cannot still be joined, writes the teardown record
# into the cohort's private classroom-config and archives that last - which is also what
# tells the nightly refresh this cohort is finished.
# NOTHING IS DELETED. Archiving is GitHub's reversible read-only freeze, and un-archiving a
# repo from its own Settings page brings it back exactly as it was.
# `dry_run` defaults to true and prints counts only. A real run refuses unless the cohort's
# schedule.yml declares a `semester_end` that has passed; `force` says so by hand.
# A run that dies half way is resumed by running it again - see docs/10.

on:
  workflow_dispatch:
    inputs:
      cohort_org:
        description: "Cohort org"
        required: true
        type: choice
        default: "hertie-intro-to-data-science-f2026"
        options:
          - hertie-intro-to-data-science-f2025
          - hertie-intro-to-data-science-f2026
      dry_run:
        description: "Preview the teardown - freeze nothing, revoke nothing"
        type: boolean
        default: true
      force:
        description: "Close out even though the term is not over"
        type: boolean
        default: false

concurrency:
  group: ${{ github.repository }}-archive-cohort
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  archive-cohort:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Archive cohort
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--cohort-org "$COHORT_ORG")
          if [ "$DRY_RUN" = "false" ]; then args+=(--no-dry-run); else args+=(--dry-run); fi
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 -m dsl_course.teardown "${args[@]}"
