# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Open team formation

# Emails every enrolled student who is still without a team for an assignment whose
# team-formation window is open: the cap, the day formation closes, and a link to the
# cohort's Join team form. It is the same message the scheduler sends by itself when a
# window opens - this is how you send it again on your own say-so, after announcing the
# assignment in class or once a cohort's mail secrets are finally set.
# NOTHING IS SAID TWICE: every message is recorded in classroom-config's
# team-formation/mailed.csv, so a second press reaches only the students a first press did
# not - a newcomer who has since joined GitHub, and nobody else.
# Leave `assignment` empty for every window that is open. Filling it in narrows the run to
# ONE schedule.yml assignment key and leaves the other windows alone; a key with no open
# window is an error, not a quiet no-op.
# Overnight (23:00-07:00 in the cohort's own timezone) the message is HELD, pressed or not
# - the students' night is the same night either way - and nothing is claimed, so the next
# quarter-hourly tick sends it in the morning.
# Dry run first; it claims nothing, sends nothing, and prints the counts with a sample of
# the wording. Needs the GRAPH_* secrets to mail.

on:
  workflow_dispatch:
    inputs:
      cohort_org:
        description: "Cohort org"
        required: true
        type: choice
        default: "hertie-intro-to-data-science-f2026"
        options:
          - hertie-intro-to-data-science-f2025
          - hertie-intro-to-data-science-f2026
      assignment:
        description: "Only this schedule.yml assignment key (leave empty for every open window)"
        required: false
        default: ""
      dry_run:
        description: "Preview the messages - claim nothing, send nothing"
        type: boolean
        default: true

concurrency:
  group: ${{ github.repository }}-open-team-formation
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  open-team-formation:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Open team formation
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE_ORG: ${{ github.repository_owner }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          ASSIGNMENT: ${{ inputs.assignment }}
          DRY_RUN: ${{ inputs.dry_run }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_CERT: ${{ secrets.GRAPH_CLIENT_CERT }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
          DSL_MAINTAINER_EMAIL: ${{ secrets.DSL_MAINTAINER_EMAIL }}
        run: |
          args=(--course-org "$COURSE_ORG" --cohort-org "$COHORT_ORG")
          [ -n "$ASSIGNMENT" ] && args+=(--assignment "$ASSIGNMENT")
          if [ "$DRY_RUN" = "false" ]; then args+=(--no-dry-run); else args+=(--dry-run); fi
          python3 -m dsl_course.team_formation "${args[@]}"
