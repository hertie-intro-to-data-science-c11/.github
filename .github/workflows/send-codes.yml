# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Send enrolment codes

# Generates a random enrolment code per student (into classroom-config/students.csv) and
# emails each not-yet-onboarded student their code to their hertie email address. Students paste
# the code into the welcome Join course issue - no personal data in the public repo. dry_run
# previews the codes + emails without writing or sending. Needs the GRAPH_* secrets.

on:
  workflow_dispatch:
    inputs:
      cohort_org:
        description: "Cohort org"
        required: true
        type: choice
        default: "hertie-intro-to-data-science-f2026"
        options:
          - hertie-intro-to-data-science-f2025
          - hertie-intro-to-data-science-f2026
      dry_run:
        description: "Preview the codes + emails - write nothing, send nothing"
        type: boolean
        default: true

concurrency:
  group: ${{ github.repository }}-send-codes
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  send-codes:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send enrolment codes
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COHORT_ORG: ${{ inputs.cohort_org }}
          DRY_RUN: ${{ inputs.dry_run }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_CERT: ${{ secrets.GRAPH_CLIENT_CERT }}
          GRAPH_SENDER: ${{ secrets.GRAPH_SENDER }}
        run: |
          args=(--cohort-org "$COHORT_ORG")
          if [ "$DRY_RUN" = "false" ]; then args+=(--no-dry-run); else args+=(--dry-run); fi
          python3 -m dsl_course.enrol_codes "${args[@]}"
