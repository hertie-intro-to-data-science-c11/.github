# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: New assignment

on:
  workflow_dispatch:
    inputs:
      assignment_name:
        description: "1. The assignment's name, e.g. Neural networks from scratch"
        required: true
      assignment_number:
        description: "2. Assignment number, e.g. 1"
        required: true
      semester_tag:
        description: "3. Year tag, e.g. f2026 or s2026 - creates assignment-<number>-<tag>"
        required: true
      format:
        description: "4. Which starter file to seed - none = the brief only. Grading reads whatever students commit either way"
        required: true
        type: choice
        default: "ipynb"
        options:
          - ipynb
          - py
          - rmd
          - qmd
          - latex
          - none
      type:
        description: "5. individual = one repo per student; group = one repo per team (teams.csv)"
        required: true
        type: choice
        default: "individual"
        options:
          - individual
          - group
      team_formation:
        description: "6. Group only: self_select = students use the Join team form; assigned = you write teams.csv"
        required: true
        type: choice
        default: "self_select"
        options:
          - self_select
          - assigned
      submit_via:
        description: "7. external = handed in off GitHub (Moodle, Kaggle, in class) - no receipts, no late arithmetic"
        required: true
        type: choice
        default: "github"
        options:
          - github
          - external
      autograde:
        description: "8. Run the template's tests/ at the cutoff. The count is shown to graders, never to a student"
        type: boolean
        default: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  scaffold:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scaffold assignment
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          DSL_BOT_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ORG: ${{ github.repository_owner }}
          NAME: ${{ inputs.assignment_name }}
          NUMBER: ${{ inputs.assignment_number }}
          TAG: ${{ inputs.semester_tag }}
          FORMAT: ${{ inputs.format }}
          TYPE: ${{ inputs.type }}
          TEAM_FORMATION: ${{ inputs.team_formation }}
          SUBMIT_VIA: ${{ inputs.submit_via }}
          AUTOGRADE: ${{ inputs.autograde }}
        run: |
          gh auth setup-git
          python3 -m dsl_course.scaffold assignment --org "$ORG" --number "$NUMBER" \
            --tag "$TAG" --name "$NAME" --format "$FORMAT" --type "$TYPE" \
            --team-formation "$TEAM_FORMATION" --submit-via "$SUBMIT_VIA" \
            --autograde "$AUTOGRADE"
          python3 -m dsl_course.seed refresh --course-org "$ORG"
